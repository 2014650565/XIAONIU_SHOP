name: auto Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
  test:
    runs-on: ubuntu-lastest
    
    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install dependencies
        run: pip install flask pytest requests pyyaml allure-pytest selenium pytest-selenium

      - name: run tests
        run: pytest