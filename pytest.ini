[pytest]

addopts = -v -s --alluredir=./temps --clean-alluredir

# Disable pytest-selenium sensitive URL protection ($^ never matches any URL)
sensitive_url = $^


markers =
    smoke: smoke test
    api: api test
    ui: ui test
    health: health test
    login: login test
    product: product test
    cart: cart test
    order: order test
    pay: pay test
    login_ui: ui login
    product_ui: ui product
    cart_ui: ui cart
    order_ui: ui order
    pay_ui: ui pay



log_file = ./logs/pytest.log
log_file_level = INFO
log_file_format = %(levelname)-8s %(asctime)s [%(module)s:%(lineno)s] : %(message)s
log_file_date_format =%Y-%m-%d %H:%M:%S

log_cli=true
log_cli_level=INFO